app = "marathon-app"
primary_region = "lhr"

[build]

[env]
  TZ = "Europe/Dublin"
  # SQLite and equipment.json live on the volume
  DB_PATH = "/data/marathon.db"

[mounts]
  source = "marathon_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
