<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marathon plan</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#e4e4df; --accent:#1d6fd6; --good:#2e8b57; --warn:#c77d00; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --ink:#ececE8; --mute:#9a9a94; --line:#2f2f2c; --accent:#5aa2f5; --good:#4fc08a; --warn:#e0a030; --bad:#e8695b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  nav a { color:var(--ink); text-decoration:none; font-weight:600; }
  nav a.dim { color:var(--mute); font-weight:400; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
  h1,h2 { margin:0 0 8px; } h1 { font-size:1.4rem; } h2 { font-size:1.1rem; }
  .big { font-size:2rem; font-weight:700; }
  .mute { color:var(--mute); font-size:.9rem; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; font-size:.95rem; }
  th { color:var(--mute); font-weight:500; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.8rem; border:1px solid var(--line); }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  label { display:block; margin:10px 0 4px; font-size:.9rem; color:var(--mute); }
  input, select, textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:1rem; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > * { flex:1; min-width:120px; }
  .banner { background:var(--card); border-left:4px solid var(--accent); padding:10px 14px; border-radius:8px; margin:12px 0; }
  .cur td { background:color-mix(in srgb, var(--accent) 8%, transparent); }
</style>
</head>
<body>
<nav><a href="/">This week</a><a href="/plan" class="dim">Full plan</a><a href="/strength" class="dim">Strength</a><a href="/equipment" class="dim">Equipment</a></nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
